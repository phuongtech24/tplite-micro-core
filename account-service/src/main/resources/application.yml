server:
  port: 8082

spring:
  application:
    name: account-service
  datasource:
    url: jdbc:h2:file:./accountdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate # Tắt chế độ tự tạo bảng, dùng Flyway
    show-sql: true
  h2:
    console:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
