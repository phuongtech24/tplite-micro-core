server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/me
        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/api/v1/customers/**,/api/v1/staff/kyc-documents/**
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/v1/accounts/**
        - id: transfer-service
          uri: lb://transfer-service
          predicates:
            - Path=/api/v1/transfers/**,/api/v1/transactions/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
        - id: loan-service
          uri: lb://loan-service
          predicates:
            - Path=/api/v1/loans/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
